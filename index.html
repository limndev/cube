<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찰칵큐브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --border:#E8E8EC; --text:#0A0A0A; --sub:#6B6B6B; --dis:#9C9C9C;
  --accent:#1E2A4A; --accent-h:#2B3A63; --danger:#DC2626; --chip:#F3F4F6; --cellb:#2A2A33;
  --l1:#3B82F6; --l2:#22A06B; --l3:#F5C542; --l4:#E5484D; --l5:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR","DM Sans","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;transition:transform 200ms,box-shadow 200ms,background-color 150ms,border-color 150ms,color 150ms}
button:disabled{cursor:default}
button:focus-visible,.dz:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(30,42,74,.22)}
h1{margin:0;font-size:48px;font-weight:700;letter-spacing:-.035em;line-height:1.15}

/* 상단 바 */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in{max-width:1232px;margin:0 auto;padding:10px 24px;min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;letter-spacing:-.03em}
.steps{display:flex;align-items:center;gap:4px}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:9999px;border:0;background:transparent;color:var(--sub);font-size:18px;font-weight:500;white-space:nowrap}
.chip.done{background:var(--chip);color:var(--text)}
.chip.active{background:var(--accent);color:#fff;font-weight:700}
.chip.todo:not(:disabled):hover,.chip.done:not(:disabled):hover{background:#E9EAEE}
.chip.todo:disabled{color:var(--dis)}

/* 본문 */
main{max-width:1232px;margin:0 auto;padding:48px 24px 64px;display:flex;flex-direction:column;gap:32px}
.head{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:14px;font-weight:500;letter-spacing:.08em;color:var(--sub)}
.lead{margin:0;font-size:22px;color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.dots{background-color:var(--bg);background-image:radial-gradient(#D9D9DF 1.2px,transparent 1.2px);background-size:24px 24px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.nav{display:flex;justify-content:flex-end;gap:12px}

/* 버튼 */
.btn{height:56px;padding:0 32px;border-radius:6px;font-size:20px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn:not(:disabled):hover{background:var(--chip);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:not(:disabled):hover{background:var(--accent-h);box-shadow:0 4px 12px rgba(30,42,74,.35)}
.btn:disabled{color:var(--dis);background:var(--chip)}
.btn.primary:disabled{background:var(--chip);border-color:var(--border);color:var(--dis)}
.btn.sm{height:48px;padding:0 20px;font-size:18px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:#fff}
.btn.danger:not(:disabled):hover{background:#FEF2F2}
.btn.lg{height:72px;font-size:24px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;background:var(--chip);color:var(--sub);font-size:16px;font-weight:500;height:36px;padding:0 16px}
.pill.w{background:#fff;border:1px solid var(--border);color:var(--text);font-weight:700}

/* ① */
.dz{border:1px dashed #C4C4CC;border-radius:12px;padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;background-color:#fff;background-image:radial-gradient(#D9D9DF 1.2px,transparent 1.2px);background-size:24px 24px;cursor:pointer;text-align:center}
.dz.over{border-color:var(--accent);background-color:#F3F5FA}
.dz p{margin:0;font-size:26px;font-weight:500;letter-spacing:-.02em}
.dz img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--border);background:#fff}
.note{margin:0;font-size:16px;color:var(--sub)}
.card.pad32{padding:32px;display:flex;flex-direction:column;gap:32px}

/* ② */
.two{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.two>.main{flex:1 1 560px}
.two>.side{flex:1 1 320px;max-width:400px;display:flex;flex-direction:column;gap:16px}
.stage{border-radius:8px;padding:48px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:24px;min-height:100%}
.grid{display:grid;gap:6px;max-width:100%}
.cell{height:var(--cell);border-radius:4px;border:1.5px solid var(--cellb);font-size:calc(var(--cell)*.4);font-weight:700;padding:0;font-family:inherit}
.cell:focus-visible{box-shadow:0 0 0 3px rgba(30,42,74,.35)}
.cell.l0{background:#fff;border-color:#C4C4CC;color:var(--sub)}
.cell.l1{background:var(--l1);color:#fff}
.cell.l2{background:var(--l2);color:#fff}
.cell.l3{background:var(--l3);color:#0A0A0A}
.cell.l4{background:var(--l4);color:#fff}
.cell.l5{background:#fff;color:#0A0A0A}
.cell:not(:disabled):active{transform:scale(.97)}
.small-label{font-size:14px;font-weight:500;letter-spacing:.08em;color:var(--sub)}
.big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.side .card{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend .pill{height:36px;color:var(--text);padding:0 14px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.dot.l5{background:#fff;border:1.5px solid var(--sub)}
.ref img{width:100%;border-radius:8px;border:1px solid var(--border);display:block}

/* ③ */
.canvas-card{flex:1 1 640px;padding:0;overflow:hidden;position:relative;min-height:520px;display:flex}
.canvas-card .cv{flex:1;min-height:520px;position:relative}
.hint{position:absolute;right:16px;top:16px;z-index:2}
.vbar{position:absolute;left:0;right:0;bottom:16px;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px}
.vbar .vbtn{background:rgba(255,255,255,.92)}
.vbar .vbtn[aria-pressed=true]{background:var(--accent)}
.legend.ov{position:absolute;left:16px;top:16px;z-index:2}
.legend.ov .pill{background:#fff;border:1px solid var(--border)}
.three{align-items:flex-start}
.three .canvas-card{height:clamp(460px,calc(100vh - 330px),780px);min-height:0}
.three .canvas-card .cv{min-height:0}
@media (max-width:1040px){.two>.side{max-width:none}.three .canvas-card{height:62vh}.hint{display:none}.three .side{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
.bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width 250ms}
.views{display:flex;flex-wrap:wrap;gap:8px}
.vbtn{height:40px;padding:0 16px;border-radius:9999px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:16px;font-weight:500}
.vbtn:hover{background:var(--chip)}
.vbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kbd{font-size:14px;color:var(--sub)}
.kbd b{font-weight:700;color:var(--text);background:var(--chip);border-radius:4px;padding:1px 6px}

/* ④ */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{height:48px;padding:0 24px;border-radius:9999px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:18px;font-weight:500}
.tab:hover{background:var(--chip)}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.stage4{border-radius:8px;padding:40px 24px 32px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:36px 40px;min-height:200px}
.panel{display:flex;flex-direction:column;align-items:center;gap:20px}
.shape{display:flex;align-items:flex-end;gap:var(--g)}
.shape.base{padding-bottom:0}
.col{display:flex;flex-direction:column-reverse;gap:var(--g)}
.tgrid{display:grid;gap:var(--g)}
.sq{width:var(--c);height:var(--c);border-radius:4px;border:1.5px solid var(--cellb)}
.sq.e{border:1px dashed #C4C4CC;background:rgba(255,255,255,.7)}
.sq.l1{background:var(--l1)} .sq.l2{background:var(--l2)} .sq.l3{background:var(--l3)} .sq.l4{background:var(--l4)} .sq.l5{background:#fff}
.sq.pop{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.plabel{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:9999px;background:#fff;border:1px solid var(--border);font-size:22px;font-weight:700}
.stage4.all .plabel{height:34px;font-size:16px;padding:0 14px}

/* 반응형 */
@media (max-width:1000px){
  h1{font-size:40px}
  .top-in{grid-template-columns:auto 1fr;}
  .steps{justify-content:flex-end}
  .brand{font-size:22px}
}
@media (max-width:760px){
  main{padding:32px 16px 48px}
  .top-in{padding:8px 16px}
  h1{font-size:32px}
  .lead{font-size:18px}
  .chip{padding:0 12px;font-size:16px}
  .chip:not(.active) .lbl{display:none}
  .btn{padding:0 22px;font-size:18px}
  .big{font-size:48px}
  .dz{padding:40px 16px}
  .dz p{font-size:20px}
}

/* 그림 참고 */
.dz.sm{padding:28px 16px;gap:10px}
.dz.sm p{font-size:18px}
.thumb{display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--text)}
.thumb:hover{background:var(--chip)}
.thumb img{max-height:130px;max-width:100%;object-fit:contain;border-radius:6px;align-self:center}
.toprow{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
.toprow .thumb{flex-direction:row;align-items:center;gap:10px;padding:8px 12px}
.toprow .thumb img{max-height:64px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lb img{max-width:min(1100px,100%);max-height:80vh;background:#fff;border-radius:8px}
.cell{position:relative}
/* 쌓기 화면 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segbtn{height:56px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:20px;font-weight:500}
.segbtn:hover{background:var(--chip)}
.segbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.segbtn[data-tool=remove][aria-pressed=true]{background:var(--danger);border-color:var(--danger)}
.emptyhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.mini{display:flex;flex-direction:column;gap:8px;align-items:center}
.canvas-card .cv{cursor:pointer}
.dz img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--border);background:#fff}

.numbar{position:absolute;left:16px;top:68px;z-index:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.numbar .vbtn{background:rgba(255,255,255,.92)}
.numbar .vbtn[aria-pressed=true]{background:var(--accent)}
.badge{position:absolute;right:16px;top:68px;z-index:2;background:var(--accent);color:#fff;border-radius:9999px;padding:6px 22px;font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ② 세 칸 배치: 그림 | 3D | 도구 */
main.wide{max-width:1600px}
.s2{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,2fr) 300px;gap:20px;align-items:start}
.s2 .refcard,.s2 .canvas-card{height:clamp(480px,calc(100vh - 290px),860px)}
.s2 .canvas-card{flex-direction:column;min-height:0}
.s2 .side{display:flex;flex-direction:column;gap:16px;min-width:0}
.cvwrap{position:relative;flex:1;min-height:0;display:flex}
.cvwrap .cv{flex:1;min-height:0;position:relative}
.floorbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--border);background:#fff}
.floorbar .sizelbl{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.floorbtns{display:flex;flex-wrap:wrap;gap:8px}
.floorbtns .btn.sm{height:44px;padding:0 16px;font-size:17px}
.refcard{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0}
.refhead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.refimg{flex:1;min-height:0;border:1px solid var(--border);border-radius:8px;background:#fff;padding:8px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.refimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.linkbtn{border:0;background:none;color:var(--sub);font-size:15px;text-decoration:underline;padding:4px;align-self:center}
.linkbtn:hover{color:var(--text)}
.refdz{flex:1;padding:24px 12px;justify-content:center;gap:10px}
.refdz p{font-size:20px}
@media (max-width:1300px){
  .s2{grid-template-columns:minmax(220px,1fr) minmax(0,2fr)}
  .s2 .side{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
}
@media (max-width:860px){
  .s2{grid-template-columns:1fr}
  .s2 .refcard{height:auto;max-height:48vh}
  .s2 .refimg{max-height:36vh}
  .s2 .canvas-card{height:64vh}
}

.cvwrap{container-type:inline-size}
@container (max-width:780px){.hint{display:none}}
.side .btn{white-space:nowrap;padding:0 12px}
/* 화면 높이가 낮은 교실 PC·프로젝터: 제목을 줄여 쌓는 화면을 크게 */
@media (max-height:950px) and (min-width:861px){
  main{padding-top:20px;gap:20px}
  .head{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:6px 20px}
  .eyebrow{display:none}
  h1{font-size:34px}
  .lead{font-size:19px}
  .s2 .refcard,.s2 .canvas-card{height:clamp(440px,calc(100vh - 210px),860px)}
}
.tgrid .sq,.shape .sq{display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.42);font-weight:700;color:#fff}
.tgrid .sq.l3,.tgrid .sq.l5,.shape .sq.l3,.shape .sq.l5{color:#0A0A0A}

/* ===== 2026-10-18 개편 ===== */
button,.dz{touch-action:manipulation}
.topright{display:flex;justify-content:flex-end}
.modebtn{height:40px;padding:0 16px;border-radius:9999px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:15px;font-weight:500;white-space:nowrap}
.modebtn:hover{background:var(--chip)}
.modebtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ① 그림 + 바닥 크기 */
.s1{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:stretch}
.dzcard{display:flex;flex-direction:column;gap:20px;padding:24px}
.dzcard .dz{flex:1;justify-content:center;padding:40px 24px}
.dzimg{width:100%;height:clamp(180px,38vh,360px);position:relative}
.dzimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;max-height:none;background:transparent}
.sizecard{display:flex;flex-direction:column;gap:18px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.steplbl{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stepctl{display:flex;align-items:center;gap:10px}
.stepbtn{width:52px;height:52px;border-radius:9999px;border:1px solid var(--border);background:#fff;font-size:28px;line-height:1;color:var(--text);display:flex;align-items:center;justify-content:center}
.stepbtn:not(:disabled):hover{background:var(--chip)}
.stepbtn:disabled{color:var(--dis);background:var(--chip)}
.stepv{min-width:36px;text-align:center;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.floorprev{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:8px;background:var(--bg)}
@media (max-width:900px){.s1{grid-template-columns:1fr}}

/* ② ③ 그림 카드: 그림은 칸 크기에 맞게 줄거나 커진다 */
.refimg{position:relative;flex:1;min-height:0;overflow:hidden}
.refimg img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);max-width:none;max-height:none;object-fit:contain}
.refnone{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:16px;border:1px dashed #C4C4CC;border-radius:8px;padding:16px}
.refcard{overflow:hidden}

/* ② */
.s2{grid-template-columns:minmax(220px,.8fr) minmax(0,2fr) 280px}
.countcard{gap:2px!important}
.countcard .big{font-size:48px}
.countcard .layers{color:var(--text);font-size:17px}
.toolcard{gap:12px!important}
.vsep{width:1px;height:28px;background:var(--border);align-self:center;margin:0 4px}
.cvwrap .vbar{bottom:14px}

/* ③ */
.s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
.s3:has(> .refcard){grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(180px,.45fr)}
.s3 > .card{height:clamp(440px,calc(100vh - 330px),820px);min-height:0}
.s3 .canvas-card{flex-direction:column}
.s3 .canvas-card .cv{cursor:grab}
.shapecard{display:flex;flex-direction:column;gap:16px;padding:16px}
.shapecard .stage4{flex:1;min-height:0;align-content:center;overflow:hidden}
.stage4.all{gap:16px 24px}
@media (max-width:1100px){
  .s3,.s3:has(> .refcard){grid-template-columns:1fr 1fr}
  .s3 > .refcard{display:none}
}
@media (max-width:760px){.s3,.s3:has(> .refcard){grid-template-columns:1fr}.s3 > .card{height:56vh}}
@media (max-height:950px) and (min-width:861px){
  .s3 > .card{height:clamp(400px,calc(100vh - 250px),820px)}
}

/* ===== 태블릿 모드: 가로 화면 한 장에 모두 들어오게, 손가락으로 누르기 쉽게 ===== */
body.tablet main{max-width:none;padding:12px 16px;gap:12px}
body.tablet .top-in{max-width:none;padding:6px 16px;min-height:56px}
body.tablet .head{flex-direction:row;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
body.tablet .eyebrow{display:none}
body.tablet h1{font-size:28px}
body.tablet .lead{font-size:17px}
body.tablet .nav .btn{height:52px}
body.tablet .s2{grid-template-columns:minmax(170px,.55fr) minmax(0,2fr) 230px;gap:12px}
body.tablet .s2 > .card,body.tablet .s2 .refcard,body.tablet .s2 .canvas-card{height:calc(100dvh - 196px);min-height:360px}
body.tablet .s2 .side{gap:12px}
body.tablet .segbtn{height:72px;font-size:24px}
body.tablet .side .btn.sm{height:56px;font-size:19px}
body.tablet .countcard{padding:14px 18px}
body.tablet .countcard .big{font-size:40px}
body.tablet .toolcard{padding:16px}
body.tablet .vbtn{height:46px;padding:0 16px;font-size:17px}
body.tablet .legend.ov .pill{height:32px;font-size:15px;padding:0 10px}
body.tablet .refcard{padding:12px}
body.tablet .linkbtn{display:none}
body.tablet .s3{gap:12px}
body.tablet .s3 > .card{height:calc(100dvh - 250px);min-height:340px}
body.tablet .tab{height:52px;font-size:19px}
body.tablet .s1{grid-template-columns:minmax(0,1fr) 320px;gap:12px}
body.tablet .dzimg{height:calc(100dvh - 330px)}
body.tablet .s3 > .refcard{display:flex}
@media (max-width:1100px){body.tablet .s3:has(> .refcard){grid-template-columns:minmax(0,1fr) minmax(0,1fr) 150px}}
@media (orientation:portrait){body.tablet .s2{grid-template-columns:1fr 1fr}body.tablet .s2 .canvas-card{grid-column:1/-1;order:-1;height:55dvh}body.tablet .s2 > .refcard{height:auto;max-height:36dvh}}
